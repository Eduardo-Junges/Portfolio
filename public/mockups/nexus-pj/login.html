<script>
/* Mockup estático do Nexus & PJ (dados fictícios). Antes do primeiro paint:
   ?embed = dentro do site (iframe), o tema acompanha o site; fora dele vale o
   tema escolhido no próprio mockup. */
(function () {
  var d = document.documentElement, t = 'dark';
  var embed = /[?&]embed\b/.test(location.search);
  try { embed = embed || sessionStorage.getItem('mk-embed') === '1'; if (embed) sessionStorage.setItem('mk-embed', '1'); } catch (e) {}
  if (embed) {
    d.classList.add('mk-embed');
    try { if (parent.document.documentElement.dataset.theme === 'light') t = 'light'; } catch (e) {}
  } else {
    try { if (localStorage.getItem('mk-tema') === 'light') t = 'light'; } catch (e) {}
  }
  d.setAttribute('data-theme', t);
  // dentro do site o Dashboard aparece direto, sem a janela de boas-vindas por cima
  if (embed) {
    var abrir = HTMLDialogElement.prototype.showModal;
    HTMLDialogElement.prototype.showModal = function () { if (this.id !== 'hmDlg') abrir.call(this); };
  }
  // o mockup não tem servidor: o que o app buscaria vira uma resposta curta
  var buscar = window.fetch;
  window.fetch = function (url, o) {
    var u = String(url);
    if (u.indexOf('/busca/previa') === 0)
      return Promise.resolve(new Response('<div class="busca-vazio" style="padding:12px 14px">No mockup a busca não consulta dados. No app, aparecem aqui lançamentos, títulos e telas.</div>', { status: 200 }));
    if (u.indexOf('/dashboard/dre/lancamentos') === 0)
      return Promise.resolve(new Response('<tr><td colspan="40" style="padding:8px 14px;opacity:.8">No mockup os lançamentos não abrem. No app, aparecem aqui, um por linha.</td></tr>', { status: 200 }));
    return buscar ? buscar.apply(this, arguments) : Promise.reject(new Error('sem fetch'));
  };
})();
</script>

  <div class="mk-aviso" id="mkAviso" role="status" aria-live="polite"></div>
<a class="mk-selo" href="login.html" title="Ver a tela de entrada">Mockup · dados fictícios</a>
<script>
(function () {
  var d = document.documentElement, caixa = document.getElementById('mkAviso'), relogio;
  function avisar(t) {
    caixa.textContent = t; caixa.classList.add('on');
    clearTimeout(relogio); relogio = setTimeout(function () { caixa.classList.remove('on'); }, 2600);
  }
  function tema(t) {
    d.setAttribute('data-theme', t);
    try { if (!d.classList.contains('mk-embed')) localStorage.setItem('mk-tema', t); } catch (e) {}
    document.querySelectorAll('.theme-switch button[name=tema]').forEach(function (b) {
      b.classList.toggle('on', (b.value === 'claro') === (t === 'light'));
    });
  }
  tema(d.getAttribute('data-theme'));
  // dentro do site, o tema acompanha o alternador do site
  if (d.classList.contains('mk-embed')) try {
    new MutationObserver(function () { tema(parent.document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'); })
      .observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) {}
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-mk-fora]');
    if (a) { e.preventDefault(); avisar('Esta tela fica só no app. O mockup mostra as principais.'); return; }
    var b = e.target.closest('.theme-switch button[name=tema]');
    if (b) { e.preventDefault(); tema(b.value === 'claro' ? 'light' : 'dark'); }
  }, true);
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-mk-form]');
    if (!f) return;
    e.preventDefault();
    if (f.querySelector('button[name=tema]')) return;
    if (f.querySelector('input[name=senha]')) { location.href = 'index.html'; return; }
    avisar(f.method === 'get' ? 'No mockup os filtros não mudam os dados. No app, a tela recalcula na hora.' : 'Mockup: nada é gravado. No app, isto salva e fica na auditoria.');
  }, true);
})();
</script>
