<div class="mk-aviso" id="mkAviso" role="status" aria-live="polite"></div>
<a class="mk-selo" href="login.html" title="Ver a tela de entrada">Mockup · dados fictícios</a>
<script>
(function () {
  var d = document.documentElement, caixa = document.getElementById('mkAviso'), relogio;
  function avisar(t) {
    caixa.textContent = t; caixa.classList.add('on');
    clearTimeout(relogio); relogio = setTimeout(function () { caixa.classList.remove('on'); }, 2600);
  }
  function tema(t) {
    d.setAttribute('data-theme', t);
    try { if (!d.classList.contains('mk-embed')) localStorage.setItem('mk-tema', t); } catch (e) {}
    document.querySelectorAll('.theme-switch button[name=tema]').forEach(function (b) {
      b.classList.toggle('on', (b.value === 'claro') === (t === 'light'));
    });
  }
  tema(d.getAttribute('data-theme'));
  // dentro do site, o tema acompanha o alternador do site
  if (d.classList.contains('mk-embed')) try {
    new MutationObserver(function () { tema(parent.document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'); })
      .observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) {}
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-mk-fora]');
    if (a) { e.preventDefault(); avisar('Esta tela fica só no app. O mockup mostra as principais.'); return; }
    var b = e.target.closest('.theme-switch button[name=tema]');
    if (b) { e.preventDefault(); tema(b.value === 'claro' ? 'light' : 'dark'); }
  }, true);
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-mk-form]');
    if (!f) return;
    e.preventDefault();
    if (f.querySelector('button[name=tema]')) return;
    if (f.querySelector('input[name=senha]')) { location.href = 'index.html'; return; }
    avisar(f.method === 'get' ? 'No mockup os filtros não mudam os dados. No app, a tela recalcula na hora.' : 'Mockup: nada é gravado. No app, isto salva e fica na auditoria.');
  }, true);
})();
</script>
